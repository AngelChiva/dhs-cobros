<style>
:root{
  --ink:#14233b; --ink2:#52617a; --blue:#2b5ca8; --blue-d:#1f4585; --sky:#5aa3dc; --bg:#edf1f6; --card:#fff; --line:#d3dbe7;
  --ok:#1b7f4e; --ok-bg:#e2f4ea; --warn:#9a6508; --warn-bg:#fdf1d3; --bad:#b3261e; --bad-bg:#fbe3e1;
  --mute:#6b7689; --mute-bg:#e9edf3; --sel:#0c6470; --sel-bg:#dcf1f3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7fa6e6;outline-offset:2px}
header{background:#16233a;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:9px;flex:none}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header h1 small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
header .who{font-size:12.5px;text-align:right;line-height:1.3}
header .who button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:12.5px}
main{max-width:920px;margin:0 auto;padding:14px 12px}
.banner{background:var(--warn-bg);color:#5c3d00;border:1px solid #e8cf8c;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#aviso{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;
  background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;font-size:14.5px;z-index:80;display:none;box-shadow:0 6px 20px rgba(20,35,59,.35)}
#aviso.err{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
nav button{flex:1;max-width:180px;background:none;border:0;border-top:3px solid transparent;padding:12px 2px 13px;font-size:13px;color:var(--ink2);font-weight:600;position:relative}
nav button[aria-current="true"]{color:var(--blue);border-top-color:var(--blue)}
nav button i{font-style:normal;background:var(--sel);color:#fff;border-radius:10px;font-size:11.5px;padding:1px 6px;margin-left:3px}
h2{font-size:17px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
.sub{color:var(--ink2);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 4px;font-size:16px}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpis .panel{margin:0;padding:11px 12px}
.kpis .panel span{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
.kpis .panel b{font-size:20px;font-variant-numeric:tabular-nums}
.kpis button.panel{text-align:left;width:100%}
.kpis button.panel.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list li:last-child{border-bottom:0}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .nm span{color:var(--ink2);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 10px;font-size:13.5px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost:hover{background:#eef3fb}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.sel{background:var(--sel)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:2fr 1.4fr 1.2fr;gap:8px;margin-bottom:10px}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:#fff;border:1px solid #b9c4d4;border-radius:7px;padding:9px 10px;min-height:42px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.fac{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mute);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.fac.dev{border-left-color:var(--bad)} .fac.falta{border-left-color:var(--warn)} .fac.sel{border-left-color:var(--sel)} .fac.ok{border-left-color:var(--ok)}
.fac .top{display:flex;gap:10px;align-items:flex-start}
.fac .top button.t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.fac .top b{display:block;font-size:15.5px}
.fac .meta{color:var(--ink2);font-size:13.5px}
.cargo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.cargo .c1{flex:1;min-width:150px}
.chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12.5px;font-weight:600;background:var(--mute-bg);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.sel{background:var(--sel-bg);color:var(--sel)}
.empty{text-align:center;color:var(--ink2);padding:26px 14px}
.login{max-width:420px;margin:40px auto;text-align:center}
#ov{position:fixed;inset:0;background:rgba(20,35,59,.5);z-index:60;display:none;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 10px 30px}
#ov.on{display:block}
#ov .sheet{background:#fff;border-radius:12px;max-width:620px;margin:0 auto;padding:16px}
#ov .sheet h2{margin-top:0}
.x{float:right;background:none;border:0;font-size:22px;line-height:1;color:var(--ink2);padding:4px 8px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line);padding:6px 6px}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.2px}
table.t td.mono{white-space:nowrap}
table.t{min-width:560px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>

/* ============ Configuración ============ */

const ADMIN_EMAIL = "dhsvideoporters@gmail.com"; // única cuenta con acceso (debe coincidir con firestore.rules)
const COL = "dhs_cobros";                         // una sola colección: facturas (f_), comunidades (c_), hojas (h_) y config
const CS_API = "https://api.contasimple.com/api/v2";

/* ============ Estado ============ */
const S = {docs:{}};
const UI = {demo:new URLSearchParams(location.search).has("demo"), user:null, ready:false, tab:"pend",
            q:"", fAdmin:"", fEstado:"abiertas", hojaLista:null, sincronizando:false};
let fdb=null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const r2 = n=>Math.round((Number(n)||0)*100)/100;
const hoy = ()=>{const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fch = s=>{ if(!s) return ""; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m+"/"+y; };
const rid = ()=>Math.random().toString(36).slice(2,9);
const norm = s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let avisoT=null;
function aviso(t,err){ const a=$("#aviso"); a.textContent=t; a.className=err?"err":""; a.style.display="block"; clearTimeout(avisoT); avisoT=setTimeout(()=>a.style.display="none",err?8000:3500); }
function cargarScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector('script[src="'+src+'"]')) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("No se ha podido cargar "+src)); document.head.appendChild(s); }); }

/* ============ Datos: lectura ============ */
const porTipo = t=>Object.entries(S.docs).filter(([id,d])=>d.tipo===t).map(([id,d])=>({id,...d}));
const facturas = ()=>porTipo("factura");
const clientes = ()=>porTipo("cliente");
const hojas = ()=>porTipo("hoja").sort((a,b)=>(b.creada||0)-(a.creada||0));
const cfg = ()=>S.docs.config||{};
const admins = ()=>(cfg().admins||[]).slice().sort((a,b)=>a.localeCompare(b,"es"));
const cliDe = f=>S.docs[f.cli]||{};

/* IBAN */
const ibanLimpio = s=>String(s||"").replace(/\s+/g,"").toUpperCase();
const ibanFmt = s=>ibanLimpio(s).replace(/(.{4})/g,"$1 ").trim();
function ibanValido(s){
  const v=ibanLimpio(s); if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v)) return false;
  if(v.startsWith("ES") && v.length!==24) return false;
  const r=(v.slice(4)+v.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);
  let m=0; for(const ch of r) m=(m*10+Number(ch))%97; return m===1;
}
/* Qué le falta a una comunidad para poder cargarle */
function faltas(cli){
  const f=[]; if(!cli||!cli.admin) f.push("Falta administrador");
  if(!cli||!cli.iban) f.push("Falta nº de cuenta"); else if(!ibanValido(cli.iban)) f.push("Nº de cuenta incorrecto"); else if(!cli.ibanOk) f.push("Cuenta sin confirmar");
  return f;
}
const ABIERTO = ["pendiente","devuelto","enviar"];
const baseDe = f=>(f.cargos||[]).filter(c=>!c.extra);
function etiqueta(f,c){ if(c.concepto) return c.concepto; const b=baseDe(f); return b.length>1 ? "Pago "+(b.indexOf(c)+1)+" de "+b.length : ""; }
const pendienteDe = f=>r2((f.cargos||[]).filter(c=>ABIERTO.includes(c.estado)).reduce((s,c)=>s+c.importe,0));
const descuadre = f=>Math.abs(r2(baseDe(f).reduce((s,c)=>s+c.importe,0))-r2(f.total))>0.005;
const nDev = c=>(c.intentos||[]).filter(i=>i.res==="devuelto").length;
function lineasEnviar(){ const L=[]; facturas().forEach(f=>(f.cargos||[]).forEach(c=>{ if(c.estado==="enviar") L.push({f,c,cli:cliDe(f)}); })); return L.sort((a,b)=>(a.cli.nombre||"").localeCompare(b.cli.nombre||"","es")); }

/* ============ Datos: escritura ============ */
async function guardar(id,data){
  if(UI.demo){ S.docs[id]={...(S.docs[id]||{}),...data}; render(); return; }
  await fdb.collection(COL).doc(id).set(data,{merge:true});
}
async function guardarVarios(pares){
  if(!pares.length) return;
  if(UI.demo){ pares.forEach(([id,d])=>S.docs[id]={...(S.docs[id]||{}),...d}); render(); return; }
  for(let i=0;i<pares.length;i+=400){ const b=fdb.batch(); pares.slice(i,i+400).forEach(([id,d])=>b.set(fdb.collection(COL).doc(id),d,{merge:true})); await b.commit(); }
}
async function borrar(id){ if(UI.demo){ delete S.docs[id]; render(); return; } await fdb.collection(COL).doc(id).delete(); }
const intento = async fn=>{ try{ await fn(); }catch(e){ console.error(e); aviso("No se ha podido guardar: "+(e.message||e),true); } };

/* ============ Acciones sobre cargos ============ */
function setCargo(fid,cid,fn){ const f=S.docs[fid]; const cargos=(f.cargos||[]).map(c=>c.id===cid?fn({...c,intentos:(c.intentos||[]).slice()}):c); return guardar(fid,{cargos}); }
function enviarACobrar(fid,cid){
  const f=S.docs[fid], fa=faltas(cliDe(f));
  if(fa.length){ aviso("No se puede enviar: "+fa.join(", ").toLowerCase()+". Complétalo en la ficha de la comunidad.",true); return abrirCliente(f.cli); }
  return intento(()=>setCargo(fid,cid,c=>({...c,estado:"enviar",prev:c.estado})));
}
const quitarDeHoja = (fid,cid)=>intento(()=>setCargo(fid,cid,c=>({...c,estado:c.prev==="devuelto"?"devuelto":"pendiente"})));
async function marcarDevuelto(fid,cid,hid){
  const motivo=prompt("Motivo de la devolución (opcional):",""); if(motivo===null) return;
  await intento(async()=>{
    await setCargo(fid,cid,c=>{ const it=c.intentos; for(let i=it.length-1;i>=0;i--){ if(it[i].res==="cargado"&&(!hid||it[i].hoja===hid)){ it[i]={...it[i],res:"devuelto",motivo,fechaDev:hoy()}; break; } } return {...c,estado:"devuelto"}; });
    if(hid&&S.docs[hid]){ const lineas=S.docs[hid].lineas.map(l=>l.fid===fid&&l.cid===cid?{...l,dev:true,motivo}:l); await guardar(hid,{lineas}); }
    aviso("Marcada como devuelta. Vuelve a pendientes.");
  });
}
const marcarCobrado = (fid,cid)=>{ if(!confirm("¿Marcar este cargo como cobrado por otra vía (transferencia, efectivo…)? Ya no saldrá en pendientes.")) return; return intento(()=>setCargo(fid,cid,c=>({...c,estado:"cobrado",via:"manual",fechaCobro:hoy()}))); };
const reabrir = (fid,cid)=>{ if(!confirm("¿Volver a poner este cargo como pendiente?")) return; return intento(()=>setCargo(fid,cid,c=>({...c,estado:"pendiente",via:null}))); };

/* ============ Hoja de la semana ============ */
async function cerrarHoja(){
  const L=lineasEnviar(); if(!L.length) return;
  const total=r2(L.reduce((s,l)=>s+l.c.importe,0));
  if(!confirm("Se va a cerrar la hoja con "+L.length+" cargos por "+eur(total)+".\n\nEsos cargos pasarán a «Cargada». ¿Continuar?")) return;
  const id="h_"+Date.now(), fecha=hoy();
  const lineas=L.map(l=>({fid:l.f.id,cid:l.c.id,numero:l.f.numero||"",comunidad:l.cli.nombre||l.f.cliNombre||"",admin:l.cli.admin||"",iban:ibanLimpio(l.cli.iban),importe:l.c.importe,concepto:etiqueta(l.f,l.c),reintento:nDev(l.c)}));
  const pares=[[id,{tipo:"hoja",fecha,creada:Date.now(),lineas,total}]];
  const porF={}; L.forEach(l=>(porF[l.f.id]=porF[l.f.id]||[]).push(l.c.id));

  const ws=XLSX.utils.aoa_to_sheet(filas); ws["!cols"]=[{wch:14},{wch:38},{wch:26},{wch:32},{wch:11},{wch:18},{wch:11}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Cargos");

function descargar(file){ const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); }
const puedeCompartir = f=>!!(navigator.canShare && f && navigator.canShare({files:[f]}));
/* Los archivos se preparan antes; así el menú de compartir se abre en el mismo toque (lo exigen iPhone y Android) */
function compartir(hid,cual){

}

/* ============ Contasimple ============ */
let csTok=null, csTokT=0;
async function csFetch(url,opt){
  let r; try{ r=await fetch(url,opt); }catch(e){ const er=new Error("Contasimple no ha respondido a la conexión desde el navegador."); er.red=true; throw er; }
  if(!r.ok){ let t=""; try{ t=(await r.text()).slice(0,160); }catch(_){} const er=new Error("Contasimple ha respondido con el error "+r.status+(t?": "+t:"")); er.status=r.status; throw er; }
  return r.json();
}
async function csToken(){
  if(csTok && Date.now()-csTokT<45*60000) return csTok;
  const key=cfg().csKey; if(!key) throw new Error("Falta la clave de Contasimple (Ajustes).");
  const j=await csFetch(CS_API+"/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=authentication_key&key="+encodeURIComponent(key)});
  if(!j.access_token) throw new Error("Contasimple no ha aceptado la clave.");
  csTok=j.access_token; csTokT=Date.now(); return csTok;
}
async function csGet(path){ const t=await csToken(); return csFetch(CS_API+path,{headers:{Authorization:"Bearer "+t,"Accept-Language":"es"}}); }
const claveCli = (nif,id,nombre)=>"c_"+(String(nif||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase() || (id?"id"+id:"n"+norm(nombre).replace(/[^a-z0-9]/g,"").slice(0,40)));

async function sincronizar(manual){
  if(UI.sincronizando||UI.demo) return; if(!cfg().csKey){ if(manual) aviso("Primero guarda la clave de Contasimple.",true); return; }
  UI.sincronizando=true; render();
  try{
    const c=cfg(), desde=c.lastSync ? new Date(c.lastSync-48*3600*1000) : new Date((c.desde||new Date().getFullYear()+"-01-01")+"T00:00:00");
    const inicio=Date.now(); let todas=[], i=0;
    for(;;){ const j=await csGet("/accounting/invoices/issued/from?date="+encodeURIComponent(desde.toISOString())+"&startIndex="+i+"&numRows=100"); const d=(j&&j.data)||[]; todas=todas.concat(d); if(d.length<100||todas.length>5000) break; i+=100; }
    const pares=[], cliNuevos={}; let nuevas=0, actual=0, pagadas=0, rect=0;
    for(const inv of todas){
      if(inv.isRectificationInvoice){ rect++; continue; }
      const t=inv.target||{}, cid=claveCli(t.nif,t.id,t.organization), fid="f_"+inv.id, ya=S.docs[fid];
      const total=r2(inv.totalAmount), pagada=inv.status==="Payed";
      const base={tipo:"factura",csId:inv.id,periodo:inv.period||"",numero:inv.number||"",fecha:String(inv.invoiceDate||"").slice(0,10),total,statusCS:inv.status||"",pagadoCS:r2(inv.totalPayedAmount),cli:cid,cliNombre:t.organization||"",notasCS:inv.notes||"",origen:"cs"};
      if(!ya){ nuevas++; if(pagada) pagadas++; base.cargos=[{id:rid(),importe:total,estado:pagada?"cobrado":"pendiente",via:pagada?"contasimple":null,intentos:[]}]; base.alta=Date.now(); }
      else{
        actual++; let cargos=(ya.cargos||[]).slice(), toca=false;
        const b=cargos.filter(x=>!x.extra);
        if(b.length===1 && b[0].estado==="pendiente" && !(b[0].intentos||[]).length && r2(b[0].importe)!==total){ cargos=cargos.map(x=>x.id===b[0].id?{...x,importe:total}:x); toca=true; }
        if(pagada && ya.statusCS!=="Payed"){ cargos=cargos.map(x=>["pendiente","devuelto"].includes(x.estado)?{...x,estado:"cobrado",via:"contasimple",fechaCobro:hoy()}:x); toca=true; }
        if(toca) base.cargos=cargos;
      }
      pares.push([fid,base]);
      const cli=S.docs[cid]||cliNuevos[cid];
      if(!cli) cliNuevos[cid]={tipo:"cliente",nombre:t.organization||"(sin nombre)",nif:t.nif||"",csId:t.id||null,admin:"",iban:"",ibanOk:false};
      else if(!S.docs[cid]||((t.organization&&S.docs[cid].nombre!==t.organization)||(!S.docs[cid].csId&&t.id))) cliNuevos[cid]={...(cliNuevos[cid]||{}),nombre:t.organization||cli.nombre,csId:t.id||cli.csId||null};
    }
    /* Nº de cuenta guardado en la ficha del cliente de Contasimple, si lo hay */
    const buscar={}; todas.forEach(inv=>{ const t=inv.target||{}; if(!t.id) return; const cid=claveCli(t.nif,t.id,t.organization); const cli={...(S.docs[cid]||{}),...(cliNuevos[cid]||{})}; if(!cli.iban) buscar[cid]=t.id; });
    let conIban=0;
    for(const [cid,eid] of Object.entries(buscar)){
      try{ const j=await csGet("/entities/"+eid+"/bankaccounts"); const l=Array.isArray(j)?j:((j&&j.data)||[]); const b=l.find(x=>x.isDefault&&x.iban)||l.find(x=>x.iban);
        if(b&&ibanValido(b.iban)){ cliNuevos[cid]={...(cliNuevos[cid]||{}),iban:ibanLimpio(b.iban),ibanCS:ibanLimpio(b.iban),ibanOrigen:"contasimple",ibanOk:false}; conIban++; } }catch(e){ if(e.red) break; }
    }
    Object.entries(cliNuevos).forEach(([id,d])=>pares.push([id,d]));
    pares.push(["config",{tipo:"config",lastSync:inicio}]);
    await guardarVarios(pares);
    if(manual||nuevas) aviso(nuevas?(nuevas+" facturas nuevas"+(pagadas?" ("+pagadas+" ya pagadas en Contasimple)":"")+(conIban?" · "+conIban+" cuentas encontradas":"")+(rect?" · "+rect+" rectificativas sin importar":"")):"Sin facturas nuevas. Todo al día.");
    UI.errSync=null;
  }catch(e){
    console.error(e); UI.errSync=e.red?"red":(e.message||String(e));
    if(manual||e.red) aviso(e.red?"No se ha podido conectar con Contasimple desde el navegador. Mira el aviso en Ajustes.":e.message,true);
  }
  UI.sincronizando=false; render();
}

/* ============ Pantallas ============ */
function estadoChip(c){
  const d=nDev(c);
  if(c.estado==="pendiente") return '<span class="chip">Pendiente</span>';
  if(c.estado==="devuelto") return '<span class="chip bad">Devuelta'+(d>1?" ×"+d:"")+'</span>';
  if(c.estado==="enviar") return '<span class="chip sel">En la hoja de esta semana</span>';
  if(c.estado==="cargado") return '<span class="chip ok">Cargada '+fch(((c.intentos||[]).slice(-1)[0]||{}).fecha)+'</span>'+(d?' <span class="chip">tras '+d+' devol.</span>':'');
  return '<span class="chip ok">Cobrada'+(c.via==="contasimple"?" (Contasimple)":c.via==="manual"?" (otra vía)":"")+'</span>';
}
function filtroFacturas(){
  const q=norm(UI.q);
  return facturas().filter(f=>{
    const cli=cliDe(f), cs=f.cargos||[];
    if(UI.fAdmin==="__sin" ? !!cli.admin : (UI.fAdmin && cli.admin!==UI.fAdmin)) return false;
    if(q && !norm([f.numero,cli.nombre,f.cliNombre,cli.admin,cli.nif].join(" ")).includes(q)) return false;
    const ab=cs.some(c=>ABIERTO.includes(c.estado));
    switch(UI.fEstado){
      case "abiertas": return ab;
      case "devueltas": return cs.some(c=>c.estado==="devuelto");
      case "falta": return ab && faltas(cli).length>0;
      case "hoja": return cs.some(c=>c.estado==="enviar");
      case "cargadas": return cs.some(c=>c.estado==="cargado");
      case "cobradas": return cs.length>0 && cs.every(c=>c.estado==="cobrado");
      default: return true;
    }
  }).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||String(a.numero).localeCompare(String(b.numero)));
}
function tarjeta(f){
  const cli=cliDe(f), fa=faltas(cli), cs=f.cargos||[];
  const cls=cs.some(c=>c.estado==="devuelto")?"dev":cs.some(c=>c.estado==="enviar")?"sel":(cs.some(c=>ABIERTO.includes(c.estado))&&fa.length)?"falta":cs.every(c=>["cargado","cobrado"].includes(c.estado))?"ok":"";
  const dias=f.fecha?Math.floor((Date.now()-new Date(f.fecha+"T00:00:00"))/864e5):0;
  return `<div class="fac ${cls}"><div class="top"><button class="t" data-act="factura" data-id="${f.id}"><b>${esc(cli.nombre||f.cliNombre||"(sin comunidad)")}</b>
    <span class="meta">Factura ${esc(f.numero||"s/n")} · ${fch(f.fecha)}${cs.some(c=>ABIERTO.includes(c.estado))&&dias>30?" · hace "+dias+" días":""} · ${cli.admin?esc(cli.admin):"<em>sin administrador</em>"}</span></button>
    <span class="num">${eur(f.total)}</span></div>
    ${descuadre(f)?'<div class="meta" style="color:var(--bad)">Los pagos no suman el total de la factura. Revísalo.</div>':""}
    ${cs.some(c=>ABIERTO.includes(c.estado))&&fa.length?`<div style="margin-top:6px">${fa.map(x=>'<span class="chip warn">'+x+'</span>').join(" ")} <button class="btn sm ghost" data-act="cliente" data-id="${f.cli}">Completar</button></div>`:""}
    ${cs.map(c=>{ const et=etiqueta(f,c); return `<div class="cargo"><div class="c1">${cs.length>1||et?`<b class="num">${eur(c.importe)}</b> ${esc(et)} `:""}${estadoChip(c)}</div>

    <div class="row" style="margin-top:12px"><button class="btn" data-act="guardarCS">Guardar</button><button class="btn ghost" data-act="sync" ${c.csKey&&!UI.sincronizando?"":"disabled"}>${UI.sincronizando?"Actualizando…":"Actualizar ahora"}</button>${c.csKey?'<button class="btn ghost" data-act="resync">Volver a traer todo</button>':""}</div></div>
  <div class="panel"><h3>Administradores de fincas</h3><p class="sub" style="margin:0">La lista de la que se elige en cada comunidad.</p>
    <ul class="list">${admins().map(a=>`<li><div class="nm"><b>${esc(a)}</b><span>${clientes().filter(x=>x.admin===a).length} comunidades</span></div><button class="btn sm danger" data-act="delAdmin" data-v="${esc(a)}">Quitar</button></li>`).join("")||'<li class="sub">Aún no hay ninguno.</li>'}</ul>
    <div class="row" style="margin-top:10px"><input type="text" id="nAdmin" placeholder="Nombre del administrador" style="flex:1;min-width:180px"><button class="btn" data-act="addAdmin">Añadir</button></div></div>
  <div class="panel"><h3>Factura a mano</h3><p class="sub" style="margin:0 0 8px">Para una factura que no venga de Contasimple.</p><button class="btn ghost" data-act="nuevaFactura">Añadir factura</button></div>`;
}

const TABS=[["pend","Pendientes"],["hoja","Cargo semana"],["hist","Historial"],["cli","Comunidades"],["aj","Ajustes"]];
function render(){
  $("#who").innerHTML=UI.user?`${esc(UI.user.email||"")}<br><button data-act="salir">Salir</button>`:(UI.demo?"Modo de prueba":"");
  const nav=$("#nav"); if(!UI.ready){ nav.hidden=true; return; }
  nav.hidden=false; const n=lineasEnviar().length;
  nav.innerHTML=TABS.map(([k,t])=>`<button data-act="tab" data-v="${k}" aria-current="${UI.tab===k}">${t}${k==="hoja"&&n?"<i>"+n+"</i>":""}</button>`).join("");
  const foco=document.activeElement&&document.activeElement.id;
  if(UI.tab==="pend"&&foco==="q"&&$("#lista")){ $("#lista").innerHTML=listaHTML(); return; }
  if(UI.tab==="aj"&&["csKey","nAdmin","desde"].includes(foco)) return;
  const v={pend:vPend,hoja:vHoja,hist:vHist,cli:vCli,aj:vAjustes}[UI.tab]();
  $("#app").innerHTML=(UI.demo?'<div class="banner">Modo de prueba: datos inventados, nada se guarda.</div>':"")+(!UI.demo&&!cfg().csKey&&UI.tab!=="aj"?'<div class="banner">Falta conectar Contasimple. Hazlo en «Ajustes».</div>':"")+v;
}

/* ============ Fichas (ventanas) ============ */
function abrir(html){ $("#sheet").innerHTML='<button class="x" data-act="cerrar" aria-label="Cerrar">×</button>'+html; $("#ov").classList.add("on"); $("#ov").scrollTop=0; }
function cerrar(){ $("#ov").classList.remove("on"); render(); }
function abrirCliente(id){
  const c=S.docs[id]; if(!c) return;
  abrir(`<h2>${esc(c.nombre)}</h2><p class="sub" style="margin:0">${c.nif?"NIF "+esc(c.nif):"Sin NIF"}</p>
    <label for="cAdmin">Administrador de fincas</label><select id="cAdmin"><option value="">— Elegir —</option>${admins().map(a=>`<option ${c.admin===a?"selected":""}>${esc(a)}</option>`).join("")}<option value="__nuevo">+ Añadir uno nuevo…</option></select>
    <input type="text" id="cAdminNuevo" placeholder="Nombre del nuevo administrador" style="display:none;margin-top:6px">
    <label for="cIban">Nº de cuenta (IBAN)</label><input type="text" id="cIban" class="mono" autocomplete="off" value="${esc(ibanFmt(c.iban))}" placeholder="ES00 0000 0000 0000 0000 0000">
    <p class="sub" id="cIbanMsg" style="margin:6px 0 0"></p>
    ${c.ibanCS&&ibanLimpio(c.iban)!==c.ibanCS?`<div class="banner" style="margin-top:8px">En Contasimple figura otra cuenta: <span class="mono">${esc(ibanFmt(c.ibanCS))}</span></div>`:""}
    <label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" id="cOk" ${c.ibanOk?"checked":""} style="width:20px;height:20px"> He comprobado que esta cuenta es la de la comunidad</label>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="guardarCliente" data-id="${id}">Guardar</button><button class="btn ghost" data-act="cerrar">Cancelar</button></div>`);
  const msg=()=>{ const v=$("#cIban").value, m=$("#cIbanMsg"); if(!ibanLimpio(v)){ m.textContent=""; return; } const ok=ibanValido(v); m.innerHTML=ok?'<span class="chip ok">Número correcto</span>':'<span class="chip bad">Número incorrecto: revisa los dígitos</span>'; };
  $("#cIban").addEventListener("input",msg); msg();
  $("#cAdmin").addEventListener("change",e=>{ $("#cAdminNuevo").style.display=e.target.value==="__nuevo"?"block":"none"; });
}
async function guardarCliente(id){
  const c=S.docs[id]; let admin=$("#cAdmin").value; const iban=ibanLimpio($("#cIban").value); let ok=$("#cOk").checked;
  const pares=[];
  if(admin==="__nuevo"){ admin=$("#cAdminNuevo").value.trim(); if(!admin) return aviso("Escribe el nombre del administrador.",true); if(!admins().includes(admin)) pares.push(["config",{tipo:"config",admins:[...admins(),admin]}]); }
  if(iban&&!ibanValido(iban)) return aviso("El nº de cuenta no es correcto. Revisa los dígitos.",true);
  if(!iban) ok=false;
  if(iban!==ibanLimpio(c.iban)&&c.ibanOk&&ok&&!confirm("Has cambiado el nº de cuenta. ¿Confirmas que el nuevo es el correcto?")) return;
  pares.push([id,{admin,iban,ibanOk:ok,ibanOrigen:iban===c.ibanCS?"contasimple":"manual"}]);
  await intento(async()=>{ await guardarVarios(pares); $("#ov").classList.remove("on"); render(); aviso("Comunidad guardada."); });
}
function abrirFactura(id){
  const f=S.docs[id]; if(!f) return; const cli=cliDe(f);
  UI.edit={id,cargos:(f.cargos||[]).map(c=>({...c}))};
  pintarFactura();
}
function pintarFactura(){
  const f=S.docs[UI.edit.id], cli=cliDe(f), cs=UI.edit.cargos, fijo=c=>!["pendiente","devuelto"].includes(c.estado);
  const sumB=r2(cs.filter(c=>!c.extra).reduce((s,c)=>s+(Number(c.importe)||0),0)), ok=Math.abs(sumB-r2(f.total))<0.005;
  abrir(`<h2>Factura ${esc(f.numero||"s/n")}</h2><p class="sub" style="margin:0"><b>${esc(cli.nombre||f.cliNombre)}</b> · ${fch(f.fecha)} · total <b>${eur(f.total)}</b>${f.origen==="cs"?" · Contasimple: "+({Payed:"pagada",Pending:"pendiente",Incomplete:"pago parcial"}[f.statusCS]||"—"):" · añadida a mano"}</p>
    ${f.notasCS?'<p class="sub" style="margin:6px 0 0">Notas: '+esc(f.notasCS)+'</p>':""}
    <h3 style="margin:14px 0 4px;font-size:15px">Pagos de esta factura</h3>
    ${cs.map((c,i)=>`<div class="cargo" style="align-items:flex-end"><div style="width:120px"><label style="margin-top:0">Importe</label><input type="number" step="0.01" inputmode="decimal" data-i="${i}" data-k="importe" value="${c.importe}" ${fijo(c)?"disabled":""}></div>
      <div style="flex:1;min-width:140px"><label style="margin-top:0">${c.extra?"Concepto del extra":"Concepto (opcional)"}</label><input type="text" data-i="${i}" data-k="concepto" value="${esc(c.concepto||"")}" placeholder="${c.extra?"Monitores…":"Pago "+(cs.filter(x=>!x.extra).indexOf(c)+1)}" ${fijo(c)?"disabled":""}></div>
      <div style="width:100%" class="row">${estadoChip(c)}
        ${!fijo(c)&&(c.extra||cs.filter(x=>!x.extra).length>1)?`<button class="btn sm danger" data-act="edDel" data-i="${i}">Quitar</button>`:""}
        ${!fijo(c)&&!c.extra?`<button class="btn sm ghost" data-act="edPartir" data-i="${i}">Dividir en dos</button>`:""}
        ${c.estado==="cargado"?`<button class="btn sm danger" data-act="devolver" data-id="${f.id}" data-c="${c.id}">Marcar devuelta</button>`:""}
        ${["pendiente","devuelto"].includes(c.estado)&&f.cargos.some(x=>x.id===c.id)?`<button class="btn sm ghost" data-act="cobrado" data-id="${f.id}" data-c="${c.id}">Cobrada por otra vía</button>`:""}
        ${c.estado==="cobrado"||c.estado==="cargado"?`<button class="btn sm ghost" data-act="reabrir" data-id="${f.id}" data-c="${c.id}">Volver a pendiente</button>`:""}</div>
      ${(c.intentos||[]).length?`<div style="width:100%" class="sub">${c.intentos.map((t,n)=>"Intento "+(n+1)+": "+fch(t.fecha)+" · "+(t.res==="devuelto"?"devuelto"+(t.motivo?" ("+esc(t.motivo)+")":""):"cargado")).join("<br>")}</div>`:""}</div>`).join("")}
    <p class="sub" style="margin:10px 0 0;${ok?"":"color:var(--bad);font-weight:600"}">Los pagos suman ${eur(sumB)} de ${eur(f.total)}${ok?"":". Tienen que sumar el total de la factura."}</p>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="edExtra">+ Añadir cargo extra</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="edGuardar" ${ok?"":"disabled"}>Guardar cambios</button><button class="btn ghost" data-act="cliente" data-id="${f.cli}">Ficha de la comunidad</button>${f.origen!=="cs"?`<button class="btn danger" data-act="delFactura" data-id="${f.id}">Borrar factura</button>`:""}</div>`);
}
function leerEdicion(){ document.querySelectorAll("#sheet input[data-i]").forEach(el=>{ const c=UI.edit.cargos[+el.dataset.i]; if(!c||el.disabled) return; c[el.dataset.k]=el.dataset.k==="importe"?r2(el.value):el.value.trim(); }); }
function nuevaFactura(){
  abrir(`<h2>Añadir factura a mano</h2>
    <label for="mCli">Comunidad</label><input type="text" id="mCli" list="dlCli" placeholder="Nombre de la comunidad"><datalist id="dlCli">${clientes().map(c=>`<option value="${esc(c.nombre)}">`).join("")}</datalist>
    <div class="grid2"><div><label for="mNum">Nº de factura</label><input type="text" id="mNum"></div><div><label for="mFecha">Fecha</label><input type="date" id="mFecha" value="${hoy()}"></div></div>
    <label for="mTotal">Importe total (€)</label><input type="number" step="0.01" inputmode="decimal" id="mTotal">
    <div class="row" style="margin-top:14px"><button class="btn" data-act="guardarManual">Añadir</button><button class="btn ghost" data-act="cerrar">Cancelar</button></div>`);
}
async function guardarManual(){
  const nombre=$("#mCli").value.trim(), numero=$("#mNum").value.trim(), fecha=$("#mFecha").value, total=r2($("#mTotal").value);
  if(!nombre||!numero||!(total>0)) return aviso("Rellena comunidad, nº de factura e importe.",true);
  if(facturas().some(f=>String(f.numero).trim()===numero)&&!confirm("Ya existe una factura con el nº "+numero+". ¿Añadirla igualmente?")) return;
  const ex=clientes().find(c=>norm(c.nombre)===norm(nombre)), cid=ex?ex.id:claveCli("",null,nombre), pares=[];
  if(!ex) pares.push([cid,{tipo:"cliente",nombre,nif:"",csId:null,admin:"",iban:"",ibanOk:false}]);
  pares.push(["m_"+Date.now(),{tipo:"factura",origen:"manual",numero,fecha,total,cli:cid,cliNombre:nombre,alta:Date.now(),cargos:[{id:rid(),importe:total,estado:"pendiente",intentos:[]}]}]);
  await intento(async()=>{ await guardarVarios(pares); $("#ov").classList.remove("on"); UI.tab="pend"; render(); aviso("Factura añadida."); });
}

/* ============ Eventos ============ */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return; const d=b.dataset;
  switch(d.act){
    case "tab": UI.tab=d.v; if(d.v!=="hoja") UI.hojaLista=null; render(); window.scrollTo(0,0); break;
    case "festado": UI.fEstado=d.v; render(); break;
    case "salir": if(!UI.demo) firebase.auth().signOut(); break;
    case "cerrar": cerrar(); break;
    case "enviar": await enviarACobrar(d.id,d.c); break;
    case "quitar": await quitarDeHoja(d.id,d.c); break;
    case "factura": abrirFactura(d.id); break;
    case "cliente": abrirCliente(d.id); break;
    case "guardarCliente": await guardarCliente(d.id); break;
    case "cerrarHoja": await cerrarHoja(); break;
    case "compartir": compartir(d.id,d.c); break;
    case "bajar": bajar(d.id,d.c); break;
    case "verEnvio": UI.hojaLista=d.id; UI.tab="hoja"; render(); window.scrollTo(0,0); prepararArchivos(d.id).then(render).catch(e=>aviso(e.message,true)); break;
    case "devolver": await marcarDevuelto(d.id,d.c,d.h); if($("#ov").classList.contains("on")) abrirFactura(d.id); break;
    case "cobrado": await marcarCobrado(d.id,d.c); if($("#ov").classList.contains("on")) abrirFactura(d.id); break;
    case "reabrir": await reabrir(d.id,d.c); if($("#ov").classList.contains("on")) abrirFactura(d.id); break;
    case "edPartir": { leerEdicion(); const cs=UI.edit.cargos, c=cs[+d.i], tot=r2(c.importe), a=r2(Math.floor(tot*50)/100); c.importe=r2(tot-a); cs.splice(+d.i+1,0,{id:rid(),importe:a,estado:"pendiente",intentos:[]}); pintarFactura(); break; }
    case "edDel": leerEdicion(); UI.edit.cargos.splice(+d.i,1); pintarFactura(); break;
    case "edExtra": leerEdicion(); UI.edit.cargos.push({id:rid(),importe:0,concepto:"",extra:true,estado:"pendiente",intentos:[]}); pintarFactura(); break;
    case "edGuardar": { leerEdicion(); const cs=UI.edit.cargos; if(cs.some(c=>!(c.importe>0))) return aviso("Todos los pagos deben tener un importe mayor que cero.",true); if(cs.some(c=>c.extra&&!c.concepto)) return aviso("Pon un concepto a cada cargo extra.",true); await intento(async()=>{ await guardar(UI.edit.id,{cargos:cs}); $("#ov").classList.remove("on"); render(); aviso("Guardado."); }); break; }
    case "delFactura": if(confirm("¿Borrar esta factura añadida a mano?")){ await intento(()=>borrar(d.id)); $("#ov").classList.remove("on"); render(); } break;
    case "guardarCS": { const k=$("#csKey").value.trim(), de=$("#desde").value, data={tipo:"config",desde:de}; if(k){ data.csKey=k; csTok=null; } await intento(async()=>{ await guardar("config",data); $("#csKey").value=""; document.activeElement.blur(); aviso("Guardado."); render(); if(k) sincronizar(true); }); break; }
    case "sync": sincronizar(true); break;
    case "resync": if(confirm("Se volverán a leer todas las facturas desde la fecha indicada. No se pierde nada de lo que ya has marcado. ¿Continuar?")){ await intento(()=>guardar("config",{tipo:"config",lastSync:null})); sincronizar(true); } break;
    case "addAdmin": { const n=$("#nAdmin").value.trim(); if(!n) return; if(admins().some(a=>norm(a)===norm(n))) return aviso("Ese administrador ya está en la lista.",true); await intento(()=>guardar("config",{tipo:"config",admins:[...admins(),n]})); $("#nAdmin").value=""; document.activeElement.blur(); render(); break; }
    case "delAdmin": { const n=clientes().filter(x=>x.admin===d.v).length; if(n) return aviso("No se puede quitar: lo tienen asignado "+n+" comunidades.",true); if(confirm("¿Quitar a "+d.v+" de la lista?")) await intento(()=>guardar("config",{tipo:"config",admins:admins().filter(a=>a!==d.v)})); break; }
    case "nuevaFactura": nuevaFactura(); break;
    case "guardarManual": await guardarManual(); break;
  }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="q"){ UI.q=ev.target.value; $("#lista").innerHTML=listaHTML(); } });
document.addEventListener("change",ev=>{ if(ev.target.id==="fAdmin"){ UI.fAdmin=ev.target.value; render(); } if(ev.target.id==="fEstado"){ UI.fEstado=ev.target.value; render(); } });
$("#ov").addEventListener("click",ev=>{ if(ev.target.id==="ov") cerrar(); });

/* ============ Arranque ============ */

  S.docs.c_B={tipo:"cliente",nombre:"C.P. Avenida del Parque 3 (ejemplo)",nif:"H00000002",admin:"Administraciones Ejemplo Dos",iban:"ES7921000813610123456789",ibanOk:false};
  S.docs.c_C={tipo:"cliente",nombre:"C.P. Plaza Nueva 7 (ejemplo)",nif:"H00000003",admin:"",iban:"",ibanOk:false};

  mk("f_2","2026-102","2026-09-25",181.5,"c_B","",[{id:"b1",importe:181.5,estado:"pendiente",intentos:[]}]);
  mk("f_3","2026-103","2026-09-29",326.7,"c_C","",[{id:"c1",importe:326.7,estado:"pendiente",intentos:[]}]);
  mk("f_4","2026-096","2026-08-20",145.2,"c_A","",[{id:"d1",importe:145.2,estado:"devuelto",intentos:[{fecha:"2026-09-26",hoja:"x",res:"devuelto",motivo:"Saldo insuficiente",fechaDev:"2026-09-30"}]},{id:"d2",importe:60.5,concepto:"Monitores",extra:true,estado:"pendiente",intentos:[]}]);
  UI.ready=true; render();

async function iniciarFirebase(){
  const v="10.12.2", b="https://www.gstatic.com/firebasejs/"+v+"/";
  await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG); fdb=firebase.firestore();
  let baja=null;
  firebase.auth().onAuthStateChanged(u=>{
    if(baja){ baja(); baja=null; } UI.user=u; UI.ready=false; S.docs={};
    if(!u){ render(); return pantallaLogin(); }
    if((u.email||"").toLowerCase()!==ADMIN_EMAIL){ render(); $("#app").innerHTML=`<div class="panel login"><h2>Sin acceso</h2><p class="sub">La cuenta ${esc(u.email)} no está autorizada. Esta app solo se abre con ${esc(ADMIN_EMAIL)}.</p><button class="btn" data-act="salir">Entrar con otra cuenta</button></div>`; return; }
    let primera=true;
    baja=fdb.collection(COL).onSnapshot(sn=>{ const o={}; sn.forEach(d=>o[d.id]=d.data()); S.docs=o; UI.ready=true; if(!$("#ov").classList.contains("on")) render(); if(primera){ primera=false; sincronizar(false); } },
      e=>{ console.error(e); UI.ready=false; render(); $("#app").innerHTML=`<div class="panel empty">No se han podido leer los datos.<br><span class="sub">Si es la primera vez, faltan por publicar las reglas de Firebase de esta app.<br>${esc(e.message)}</span></div>`; });
  });
}
async function pantallaLogin(){
  $("#app").innerHTML=`<div class="panel login"><h2>Cobros DHS</h2><p class="sub">Entra con la cuenta de Google de DHS.</p><div id="gbtn" style="display:flex;justify-content:center;margin-top:14px"></div></div>`;
  try{
    if(!window.google||!google.accounts) await cargarScript("https://accounts.google.com/gsi/client");
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:r=>firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential(r.credential)).catch(e=>aviso("No se ha podido iniciar sesión: "+e.message,true))});
    google.accounts.id.renderButton($("#gbtn"),{theme:"filled_blue",size:"large",text:"signin_with",locale:"es"});
  }catch(e){ aviso("No se ha podido cargar el botón de Google. Recarga la página.",true); }
}
if(UI.demo) iniciarDemo(); else iniciarFirebase().catch(e=>{ $("#app").innerHTML=`<div class="panel empty">No se ha podido conectar con la base de datos. Recarga la página.<br><span class="sub">${esc(e.message)}</span></div>`; });
</script>
